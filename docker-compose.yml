# Run FlowForge on your own machine or server: a Postgres database plus one app
# container (API + workflow runner + website). Fill in .env first (see .env.example).
# Open http://localhost:3000 when it's up.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flowforge
      # Required: set POSTGRES_PASSWORD in the .env file next to this compose file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flowforge
    # Only reachable from this machine, never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://flowforge:${POSTGRES_PASSWORD}@db:5432/flowforge
      # "production" turns on the safety checks and Secure (HTTPS-only) login cookies.
      # For a quick test over plain http://localhost, set NODE_ENV=development in .env.
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      # This app's public address, e.g. https://flowforge.example.com
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Other websites allowed to call the API (only if the website is hosted elsewhere).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
