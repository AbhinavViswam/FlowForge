version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge_password
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://flowforge:flowforge_password@db:5432/flowforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super-secret-key-change-in-production
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-byte-min-encryption-key}
      - SINK_DATABASE_URL=${SINK_DATABASE_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "npx prisma migrate deploy --schema=prisma/schema.prisma && npm run start -w @flowforge/api"

  worker:
    build:
      context: .
      target: worker
    environment:
      - DATABASE_URL=postgresql://flowforge:flowforge_password@db:5432/flowforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-byte-min-encryption-key}
      - SINK_DATABASE_URL=${SINK_DATABASE_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"

volumes:
  db_data:
