# Render Blueprint: one free web service running all of FlowForge (API, workflow
# runner and website). The database is external (e.g. Supabase free Postgres).
#
# In Render: New > Blueprint > pick this repo. Render asks for every value marked
# "sync: false" below. See DEPLOY.md for where each value comes from.

services:
  - type: web
    name: flowforge
    runtime: docker
    plan: free
    # Closest Render region to the Supabase database (Tokyo, ap-northeast-1).
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render sits in front of the app; count sign-in limits by the visitor's real IP.
      - key: TRUST_PROXY
        value: "true"
      # Supabase "Session pooler" connection string, with ?sslmode=require&connection_limit=5
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Keep a copy of this somewhere safe: without it, saved passwords and
      # connection strings can't be decrypted.
      - key: ENCRYPTION_KEY
        sync: false
      # Email is optional. Without it, sign-up needs no confirmation code and
      # "Forgot password" is hidden. To turn email on later, add BREVO_API_KEY and
      # EMAIL_FROM in the Render dashboard (Render's free plan blocks Gmail/SMTP).
      # AI transform step
      - key: GEMINI_API_KEY
        sync: false
